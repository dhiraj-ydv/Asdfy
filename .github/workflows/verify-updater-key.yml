name: Verify updater signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Match secret to updater public key
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Sign with the Actions secret and verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing or empty"
            exit 1
          fi
          echo "private key secret is present"
          python3 - << 'PY'
          import json, subprocess, base64, pathlib
          raw = subprocess.check_output(
              ["git", "show", "7bb828a^:src-tauri/tauri.conf.json"], text=True
          )
          pubkey = json.loads(raw)["plugins"]["updater"]["pubkey"]
          pathlib.Path("updater.pub").write_bytes(base64.b64decode(pubkey))
          pathlib.Path("payload.txt").write_text("asdfy-updater-key-check\n")
          print("loaded historical updater public key")
          PY
          sign() {
            npm exec --yes --package @tauri-apps/cli@2.8.4 -- tauri signer sign payload.txt >sign-out.txt 2>sign-err.txt
          }
          if ! sign; then
            if grep -qi "password" sign-err.txt; then
              echo "retrying with an empty key password"
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" sign || {
                echo "signing failed after the empty-password retry"
                exit 1
              }
            else
              echo "signing failed"
              exit 1
            fi
          fi
          python3 - << 'PY'
          import base64, pathlib
          pub = pathlib.Path("updater.pub").read_text()
          pub_id = pub.splitlines()[0].rsplit(":", 1)[-1].strip().upper()
          sig = base64.b64decode(pathlib.Path("payload.txt.sig").read_text())
          sig_text = sig.decode()
          sig_bytes = base64.b64decode(sig_text.splitlines()[1])
          sig_id = sig_bytes[2:10].hex().upper()
          if pub_id != sig_id:
              raise SystemExit(f"key id mismatch: public {pub_id} signature {sig_id}")
          print("TAURI_SIGNING_PRIVATE_KEY matches the updater public key")
          PY
