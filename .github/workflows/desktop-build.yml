name: Linux build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Release and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate application and tag versions
        run: node scripts/check-release.mjs
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Frontend regression tests
        run: node --experimental-strip-types --test "frontend/tests/*.test.mjs"
      - name: Frontend type check
        run: npm --prefix frontend exec -- vue-tsc -b frontend/tsconfig.app.json
      - name: Audit JavaScript dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
      - name: Browser interaction regression tests
        run: |
          npm --prefix frontend install --no-save --package-lock=false @playwright/test@1.58.2
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend exec -- playwright test --config frontend/playwright.config.ts

  linux-flatpak:
    name: Linux Flatpak package
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test native backend and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak install -y --user flathub org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.node22//25.08

      - name: Build Flatpak bundle
        run: |
          chmod +x packaging/flatpak/build-flatpak.sh
          ./packaging/flatpak/build-flatpak.sh

      - name: Installed Flatpak startup smoke test
        run: |
          flatpak install --user -y dist/typedh-*-x86_64.flatpak
          set +e
          xvfb-run -a dbus-run-session -- timeout 20s flatpak run --user --nosocket=wayland --socket=x11 --env=GDK_BACKEND=x11 --env=LIBGL_ALWAYS_SOFTWARE=1 io.github.exolithelabs.typedh > /tmp/typedh-startup.log 2>&1
          status=$?
          set -e
          cat /tmp/typedh-startup.log
          if [[ "$status" != 124 ]]; then
            echo "Application exited during startup (status $status)" >&2
            exit 1
          fi
          test -f "$HOME/.var/app/io.github.exolithelabs.typedh/data/io.github.exolithelabs.typedh/progress.sqlite3"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TypeDH-Linux-x86_64
          path: dist/typedh-*-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          pattern: TypeDH-Linux-*
          merge-multiple: true

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          (cd release-artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
          files+=(SHA256SUMS)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) != true ]]; then
              echo "Refusing to overwrite an already published release. Use a new version tag." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --draft \
              --generate-notes \
              --title "TypeDH $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
