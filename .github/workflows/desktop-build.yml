name: Desktop build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Release and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate application and tag versions
        run: node scripts/check-release.mjs
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Frontend regression tests
        run: node --experimental-strip-types --test "frontend/tests/*.test.mjs"
      - name: Frontend type check
        run: npm --prefix frontend exec -- vue-tsc -b frontend/tsconfig.app.json
      - name: Audit JavaScript dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
      - name: Generate license notices for the browser tests
        run: node scripts/third-party-notices.mjs
      - name: Browser interaction regression tests
        run: |
          npm --prefix frontend install --no-save --package-lock=false @playwright/test@1.58.2
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend exec -- playwright test --config frontend/playwright.config.ts

  package:
    name: ${{ matrix.name }} package
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Tag builds take the protected release environment so the signing key is
    # injected only after a reviewer approves a v* deployment. An empty name
    # selects no environment, which keeps the key off pull requests and branch builds.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's older glibc lets the AppImage run on more distributions.
          # Linux ships only an AppImage. Updater signatures are separate globs so
          # pull requests and branch builds, which do not sign, still upload the package.
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage
            target: ''
            rust-targets: ''
            artifact: Asdfy-Linux-x86_64
            path: src-tauri/target/release/bundle/appimage/*.AppImage
            updater: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - name: Windows
            os: windows-2022
            bundles: nsis
            target: ''
            rust-targets: ''
            artifact: Asdfy-Windows-x86_64
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
            updater: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          - name: macOS
            os: macos-15
            # `app` is required on tag builds: Tauri writes Asdfy.app.tar.gz only for
            # the app target. A dmg-only build skips updater artifacts.
            bundles: app,dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: Asdfy-macOS-universal
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz|src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file libfuse2 xvfb

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test native backend and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build ${{ matrix.bundles }} package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(build --bundles "${{ matrix.bundles }}")
          if [[ -n "${{ matrix.target }}" ]]; then args+=(--target "${{ matrix.target }}"); fi
          # Only version tags sign updater artifacts. Other runs keep createUpdaterArtifacts off
          # and drop the key, which the release environment would not have supplied anyway.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
              echo "Tag builds require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD from the release environment." >&2
              exit 1
            fi
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npm run tauri -- "${args[@]}"

      - name: Linux AppImage smoke test
        if: runner.os == 'Linux'
        run: |
          bundle=src-tauri/target/release/bundle
          data="$HOME/.local/share/io.github.exolithelabs.asdfy"
          appimage=$(ls "$bundle"/appimage/*.AppImage)
          chmod +x "$appimage"
          # The AppImage must stay open for 20 seconds and create its database.
          set +e
          xvfb-run -a dbus-run-session -- timeout 20s env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" > /tmp/asdfy-startup.log 2>&1
          status=$?
          set -e
          cat /tmp/asdfy-startup.log
          if [[ "$status" != 124 ]]; then
            echo "$appimage exited during startup (status $status)" >&2
            exit 1
          fi
          test -f "$data/progress.sqlite3"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -f "$bundle"/appimage/*.AppImage.sig
          fi

      - name: Collect artifact paths
        id: bundle
        shell: bash
        run: |
          {
            echo 'paths<<EOF'
            printf '%s\n' "${{ matrix.path }}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              IFS='|' read -ra updater_globs <<< "${{ matrix.updater }}"
              shopt -s nullglob
              for glob in "${updater_globs[@]}"; do
                matches=( $glob )
                if [[ ${#matches[@]} -eq 0 ]]; then
                  echo "Missing updater artifact: $glob" >&2
                  exit 1
                fi
                printf '%s\n' "$glob"
              done
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.bundle.outputs.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Download packaged applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          pattern: Asdfy-*
          merge-multiple: true

      - name: Publish release and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Nested bundle folders (dmg/ and macos/) are flattened so SHA256SUMS and
          # latest.json name files exactly as they are published.
          find release-artifacts -mindepth 2 -type f -exec mv -t release-artifacts {} +
          find release-artifacts -mindepth 1 -type d -empty -delete
          if find release-artifacts -mindepth 2 -type f | grep -q .; then
            echo "Release files are still nested:" >&2
            find release-artifacts -type f >&2
            exit 1
          fi

          (
            cd release-artifacts
            shopt -s nullglob
            require_one() {
              local pattern=$1 label=$2
              local matches=( $pattern )
              if [[ ${#matches[@]} -ne 1 ]]; then
                echo "Expected one ${label} (${pattern}), found ${#matches[@]}: ${matches[*]}" >&2
                exit 1
              fi
            }
            require_one '*.AppImage' 'Linux AppImage'
            require_one '*.AppImage.sig' 'Linux AppImage signature'
            require_one '*-setup.exe' 'Windows installer'
            require_one '*-setup.exe.sig' 'Windows installer signature'
            require_one '*.dmg' 'macOS disk image'
            require_one '*.app.tar.gz' 'macOS updater archive'
            require_one '*.app.tar.gz.sig' 'macOS updater signature'
            mapfile -d '' all < <(find . -maxdepth 1 -type f -print0)
            if [[ ${#all[@]} -ne 7 ]]; then
              echo "Expected 7 release files (3 packages, the macOS updater archive, and 3 signatures), found ${#all[@]}:" >&2
              printf '%s\n' "${all[@]}" >&2
              exit 1
            fi
          )

          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > /tmp/release-notes.md
          node scripts/updater-manifest.mjs release-artifacts "$GITHUB_REF_NAME" "$(cat /tmp/release-notes.md)"

          (cd release-artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          files+=(SHA256SUMS)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) != true ]]; then
              echo "Refusing to overwrite an already published release. Use a new version tag." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest \
              --notes-file /tmp/release-notes.md --title "Asdfy $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --notes-file /tmp/release-notes.md \
              --title "Asdfy $GITHUB_REF_NAME" \
              --verify-tag \
              --latest
          fi
