app-id: io.github.exolithelabs.typedh
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: typedh
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

build-options:
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    NPM_CONFIG_CACHE: /run/build/typedh/npm-cache
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'
    CARGO_HOME: /run/build/typedh/cargo-home
    CARGO_NET_RETRY: '3'

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: typedh
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - node_modules
          - frontend/node_modules
          - frontend/dist
          - src-tauri/target
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
          - dist
    build-commands:
      - node --version && npm --version && cargo --version && rustc --version
      - npm --prefix frontend ci
      - npm --prefix frontend run build
      - cargo build --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/typedh /app/bin/typedh-bin
      - install -Dm755 packaging/flatpak/typedh-launcher.sh /app/bin/typedh
      - install -Dm644 packaging/flatpak/io.github.exolithelabs.typedh.desktop /app/share/applications/io.github.exolithelabs.typedh.desktop
      - install -Dm644 packaging/flatpak/io.github.exolithelabs.typedh.metainfo.xml /app/share/metainfo/io.github.exolithelabs.typedh.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.exolithelabs.typedh.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.exolithelabs.typedh.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.exolithelabs.typedh.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.exolithelabs.typedh.png
