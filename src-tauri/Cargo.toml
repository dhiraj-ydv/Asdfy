[package]
name = "asdfy"
version = "0.2.4"
description = "Asdfy — touch-typing tutor"
authors = ["Exolithe Labs"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "asdfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
